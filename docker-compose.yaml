version: '3.8'

services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3
  backend1:
    build: ./backend1
  backend2:
    build: ./backend2
  backend3:
    build: ./backend3
  backend4:
    build: ./backend4