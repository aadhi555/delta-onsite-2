events { worker_connections 1024; }

http {
    upstream backend {
        hash $http_x_user_id consistent;
        server backend1:5000;
        server backend2:5000;
        server backend3:5000;
        server backend4:5000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend;
        }
    }
}